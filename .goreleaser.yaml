version: 2

project_name: lfr

builds:
  - id: lfr
    main: ./cmd/lfr
    binary: lfr
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, SKILL.md, docs/*]

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: lfr
    binaries: [lfr]
    description: Your own mail server and newsletters in one Go binary, run by your coding agent
    homepage: https://lfr.email
    license: MIT
    repository:
      owner: Anonyfox
      name: homebrew-tap
      git:
        url: git@github.com:Anonyfox/homebrew-tap.git
        private_key: '{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}'
    commit_author:
      name: Maximilian Stroh
      email: Fox56@gmx.de
    directory: Casks
    skip_upload: auto
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/lfr"]
          end

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  header: |
    Install or upgrade on the server:

    ```sh
    curl -fsSL https://lfr.email/install.sh | sudo sh
    ```

    Without sudo the script installs to `~/.local/bin`, which is enough on a machine that only drives a server over ssh. With Homebrew: `brew install anonyfox/tap/lfr`.
  draft: false
  prerelease: auto
