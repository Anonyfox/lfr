name: Pages

# Builds lfr.email from site/ with lfm and publishes it with the files agents
# fetch from the root: install.sh, SKILL.md and llms.txt.

on:
  push:
    branches: [main]
    paths: [site/**, install.sh, SKILL.md, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install lfm
        run: go install github.com/Anonyfox/lfm/cmd/lfm@latest
      - name: Compile the page
        working-directory: site
        run: lfm compile
      - name: Add root files
        run: |
          cp install.sh SKILL.md site/extra/llms.txt site/output/
          echo lfr.email > site/output/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
