name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test -race -timeout 15m ./...
      - name: release notes from CHANGELOG.md
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v} " 'index($0, v) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q . "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME}"; exit 1; }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - name: the binary reports the tag
        run: |
          bin=$(find dist -type f -name lfr -path '*linux_amd64*' | head -1)
          "$bin" version | tee "$RUNNER_TEMP/version"
          grep -Eq "^lfr v?${GITHUB_REF_NAME#v}( |\$)" "$RUNNER_TEMP/version"
      - name: archives are owned by root
        run: sh scripts/archive-owner.sh dist/*.tar.gz
