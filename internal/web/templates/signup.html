{{define "signup"}}<form class="signup" method="post" action="{{.SignupURL}}">
<label class="field" for="email">{{t .Lang "form.email"}}</label>
<div class="row">
<label class="hp" aria-hidden="true">Website <input name="website" tabindex="-1" autocomplete="off"></label>
<input type="hidden" name="ts" value="{{.FormToken}}">
<input type="email" id="email" name="email" required autocomplete="email" placeholder="name@example.com">
<button type="submit">{{t .Lang "form.submit"}}</button>
</div>
{{if .Cadence}}<p class="cadence">{{.Cadence}}</p>{{end}}
<p class="consent">{{.Consent}}</p>
</form>{{end}}
